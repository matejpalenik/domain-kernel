# S3 and SharePoint with an explicit dotenv file. See the equivalent Python configuration in README.md.
schema_version = 1
env_file = ".env"

[database]
type = "sqlite"
path = ".domain-kernel/state.sqlite3"

[credentials.input_aws]
provider = "aws_profile"
profile = "client-inputs"

[credentials.output_aws]
provider = "aws_profile"
profile = "domain-kernel-outputs"

[credentials.sharepoint]
provider = "entra_client_secret"
tenant_id = { env = "DK_SHAREPOINT_TENANT_ID" }
client_id = { env = "DK_SHAREPOINT_CLIENT_ID" }
client_secret = { env = "DK_SHAREPOINT_CLIENT_SECRET" }

[readers.inputs]
type = "s3"
bucket = "client-inputs-example"
prefix = "manufacturing/"
region = "eu-central-1"
credentials = "input_aws"

[readers.manuals]
type = "sharepoint"
drive_id = "replace-with-drive-id"
root_item_id = "replace-with-folder-item-id"
credentials = "sharepoint"

[parsers.documents]
type = "docling"

[stores.artifacts]
type = "s3"
bucket = "domain-kernel-outputs-example"
prefix = "artifacts/"
region = "eu-central-1"
credentials = "output_aws"

[storage]
artifact_store = "artifacts"

[processing]
mode = "memory"
max_source_bytes = 67108864
max_concurrent_sources = 2

[retention]
originals = false
extracted_text = false
evidence_excerpts = false
