minimum_pre_commit_version: '4.7.0'
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (whole project)
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format verification (whole project)
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: basedpyright
        name: BasedPyright (all diagnostics)
        entry: uv run --locked basedpyright
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Complete fast unit suite
        entry: uv run --locked pytest -m "not integration"
        language: system
        pass_filenames: false
        always_run: true
      - id: trailing-whitespace
        name: Trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: End of file newline
        entry: uv run --locked end-of-file-fixer
        language: system
        types: [text]
      - id: check-yaml
        name: Validate YAML
        entry: uv run --locked check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: Validate TOML
        entry: uv run --locked check-toml
        language: system
        types: [toml]
      - id: check-merge-conflict
        name: Check merge conflicts
        entry: uv run --locked check-merge-conflict
        language: system
        types: [text]
